<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pulse Qwen Autopilot architecture</title>
  <desc id="desc">A bystander uses the Pulse Vercel application. A protected proxy calls an Alibaba Function Compute FastAPI service, where Qwen orchestrates deterministic safety, Google care-search, and handoff tools. A signed human approval gate is required before a controlled call or sandbox outcome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#152238" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#47617f"/>
    </marker>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.subtitle{font:500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526276}.lane{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2px;fill:#526276}.node-title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.node-sub{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526276}.small{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526276}.edge{fill:none;stroke:#47617f;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#c81e36;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="78" class="title">Pulse Qwen Autopilot</text>
  <text x="80" y="112" class="subtitle">Qwen interprets and orchestrates. Deterministic tools calculate. A human approves every external action.</text>

  <rect x="60" y="155" width="1480" height="172" rx="24" fill="#ffffff" stroke="#d9e3ef"/>
  <text x="88" y="187" class="lane">EXPERIENCE &amp; TRUST BOUNDARY</text>
  <g filter="url(#shadow)"><rect x="100" y="215" width="260" height="78" rx="16" fill="#fff7f8" stroke="#e9a9b4"/><text x="230" y="247" text-anchor="middle" class="node-title">Bystander / judge</text><text x="230" y="272" text-anchor="middle" class="node-sub">reviewed report + GPS</text></g>
  <g filter="url(#shadow)"><rect x="470" y="215" width="300" height="78" rx="16" fill="#ffffff" stroke="#b9cbe1"/><text x="620" y="247" text-anchor="middle" class="node-title">Pulse · Next.js</text><text x="620" y="272" text-anchor="middle" class="node-sub">new Vercel project</text></g>
  <g filter="url(#shadow)"><rect x="900" y="205" width="360" height="98" rx="16" fill="#eef4ff" stroke="#86a9df"/><text x="1080" y="240" text-anchor="middle" class="node-title">Protected agent proxy</text><text x="1080" y="265" text-anchor="middle" class="node-sub">validate response · sign receipt</text><text x="1080" y="287" text-anchor="middle" class="node-sub">bind report · plan · facilities</text></g>
  <path d="M360 254 H470" class="edge"/><path d="M770 254 H900" class="edge"/>

  <rect x="60" y="355" width="1480" height="322" rx="24" fill="#ffffff" stroke="#d9e3ef"/>
  <text x="88" y="387" class="lane">ALIBABA CLOUD FUNCTION COMPUTE · FASTAPI · SINGAPORE</text>
  <g filter="url(#shadow)"><rect x="100" y="430" width="300" height="112" rx="16" fill="#fff8ed" stroke="#e8ba76"/><text x="250" y="466" text-anchor="middle" class="node-title">Qwen Cloud</text><text x="250" y="492" text-anchor="middle" class="node-sub">qwen3.7-plus</text><text x="250" y="518" text-anchor="middle" class="node-sub">reasoning + tool orchestration</text></g>
  <g filter="url(#shadow)"><rect x="510" y="414" width="350" height="144" rx="16" fill="#f5f8fc" stroke="#9fb6cf"/><text x="685" y="450" text-anchor="middle" class="node-title">Allowlisted tool dispatcher</text><text x="685" y="477" text-anchor="middle" class="node-sub">Pydantic validation · 5 rounds max</text><text x="685" y="502" text-anchor="middle" class="node-sub">40 s budget · one transient retry</text><text x="685" y="527" text-anchor="middle" class="node-sub">canonical SHA-256 result hashes</text></g>
  <g><rect x="980" y="404" width="470" height="62" rx="14" fill="#eef9f2" stroke="#9dc9ad"/><text x="1215" y="432" text-anchor="middle" class="node-title">Deterministic safety protocol</text><text x="1215" y="453" text-anchor="middle" class="node-sub">Qwen selects; code owns instructions</text></g>
  <g><rect x="980" y="484" width="470" height="62" rx="14" fill="#eef4ff" stroke="#9eb9dd"/><text x="1215" y="512" text-anchor="middle" class="node-title">Google care evidence</text><text x="1215" y="533" text-anchor="middle" class="node-sub">real IDs · distance · travel time · source URL</text></g>
  <g><rect x="980" y="564" width="470" height="74" rx="14" fill="#f8f5ff" stroke="#baa9dc"/><text x="1215" y="592" text-anchor="middle" class="node-title">Verified handoff + plan</text><text x="1215" y="615" text-anchor="middle" class="node-sub">searched facility only · deterministic plan hash</text></g>
  <path d="M400 486 H510" class="edge"/><path d="M860 458 H980" class="edge"/><path d="M860 486 H940 V515 H980" class="edge"/><path d="M860 516 H920 V601 H980" class="edge"/>
  <text x="250" y="580" text-anchor="middle" class="small">No approval or call tool exists</text>
  <text x="1215" y="659" text-anchor="middle" class="small">Public listing status never claims beds, readiness, or acceptance</text>

  <rect x="60" y="705" width="1480" height="150" rx="24" fill="#ffffff" stroke="#d9e3ef"/>
  <text x="88" y="737" class="lane">HUMAN ACTION BOUNDARY</text>
  <g filter="url(#shadow)"><rect x="160" y="765" width="360" height="62" rx="16" fill="#fff7f8" stroke="#e9a9b4"/><text x="340" y="792" text-anchor="middle" class="node-title">Human approval gate</text><text x="340" y="814" text-anchor="middle" class="node-sub">reason required for overrides</text></g>
  <g filter="url(#shadow)"><rect x="650" y="765" width="390" height="62" rx="16" fill="#f5f8fc" stroke="#9fb6cf"/><text x="845" y="792" text-anchor="middle" class="node-title">Controlled call or sandbox</text><text x="845" y="814" text-anchor="middle" class="node-sub">Vapi / Twilio test line only</text></g>
  <g><rect x="1170" y="765" width="270" height="62" rx="16" fill="#eef9f2" stroke="#9dc9ad"/><text x="1305" y="792" text-anchor="middle" class="node-title">Truthful outcome</text><text x="1305" y="814" text-anchor="middle" class="node-sub">accepted · not confirmed · failed</text></g>
  <path d="M520 796 H650" class="edge"/><path d="M1040 796 H1170" class="edge"/>
  <path d="M250 542 C250 700 270 700 310 765" class="dash"/><text x="160" y="688" class="small" fill="#8f1830">Qwen cannot approve</text>
</svg>
